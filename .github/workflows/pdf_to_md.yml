name: Convert PDF to Markdown

on:
  push:
    paths:
      - '**.pdf'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber

      - name: Convert PDF to MD
        run: |
          python -c "
          import pdfplumber
          import glob
          import os

          pdf_files = glob.glob('*.pdf') + glob.glob('**/*.pdf', recursive=True)
          for pdf_file in pdf_files:
              md_filename = os.path.splitext(pdf_file)[0] + '.md'
              try:
                  with pdfplumber.open(pdf_file) as pdf:
                      text = ''
                      for page in pdf.pages:
                          extracted = page.extract_text()
                          if extracted:
                              text += extracted + '\n\n---\n\n'
                  with open(md_filename, 'w', encoding='utf-8') as f:
                      f.write(text)
                  print(f'Successfully converted {pdf_file} to {md_filename}')
              except Exception as e:
                  print(f'Error processing {pdf_file}: {e}')
          "

      - name: Commit and Push Markdown Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-convert PDF to Markdown"
            git push
          fi
