name: Convert PDF to Markdown

on:
  push:
    paths:
      - '**.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pdfplumber
        run: pip install pdfplumber

      - name: Create and run script
        run: |
          cat << 'EOF' > run_convert.py
          import glob, os, pdfplumber

          pdf_files = glob.glob('*.pdf') + glob.glob('**/*.pdf', recursive=True)
          for f in pdf_files:
              if '.github' in f: continue
              try:
                  with pdfplumber.open(f) as pdf:
                      txts = [p.extract_text() for p in pdf.pages if p.extract_text()]
                  out = os.path.splitext(f)[0] + '.md'
                  with open(out, 'w', encoding='utf-8') as fp:
                      fp.write('\n\n---\n\n'.join(txts))
                  print(f'Done: {f}')
              except Exception as e:
                  print(f'Error {f}: {e}')
          EOF
          python run_convert.py

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto convert PDF to Markdown"
